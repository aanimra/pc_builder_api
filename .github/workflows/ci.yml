name: CI Web Service Pipeline

on:
  push:
    branches:
      - main
      - "feature/*"
      - "bugfix/*"
    paths-ignore:
      - "docs/**"
      - "README.md"

jobs:
  # Завдання 1: Збирання проєкту та виконання модульних тестів
  build-n-test:
    name: Build and Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests with pytest
        run: |
          pytest -v

  # Завдання 2: Збирання образу через Reusable Workflow
  docker-pack-n-push:
    name: Call Docker Pack and Push
    needs: build-n-test
    uses: ./.github/workflows/docker-pack-n-push.yml
    with:
      image_name: "mintyyyn/pc_builder_api"
      image_tag: "latest"
      push_to_hub: ${{ github.ref_name == 'main' }}
    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_password: ${{ secrets.DOCKER_PASSWORD }}
