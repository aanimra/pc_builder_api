name: Docker Pack and Push (Reusable)

on:
  workflow_call:
    inputs:
      image_name:
        description: "Назва репозиторію в Docker Hub"
        required: true
        type: string
      image_tag:
        description: "Тег для Docker образу"
        required: false
        default: "latest"
        type: string
      push_to_hub:
        description: "Ознака публікації в Docker Hub (true тільки для main)"
        required: false
        default: false
        type: boolean
    secrets:
      docker_username:
        required: false
      docker_password:
        required: false

jobs:
  pack-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ inputs.push_to_hub }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_password }}

      - name: Build and Push to Docker Hub
        if: ${{ inputs.push_to_hub }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ inputs.image_name }}:${{ inputs.image_tag }}
            ${{ inputs.image_name }}:${{ github.run_number }}

      - name: Build and Export Image to TAR
        if: ${{ !inputs.push_to_hub }}
        run: |
          docker build -t ${{ inputs.image_name }}:${{ inputs.image_tag }} .
          docker save -o docker-image.tar ${{ inputs.image_name }}:${{ inputs.image_tag }}

      # Зберігаємо tar-файл образу в артефактах GitHub Actions
      - name: Upload Docker Image Artifact
        if: ${{ !inputs.push_to_hub }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-artifact
          path: docker-image.tar
          retention-days: 2
